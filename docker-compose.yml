services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: iec_expobot
      POSTGRES_USER: iec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iec-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iec -d iec_expobot"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://iec:${POSTGRES_PASSWORD:-iec-local-development-only}@db:5432/iec_expobot?schema=public
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iec-local-development-only}
      AUTH_SECRET: ${AUTH_SECRET:-local-iec-auth-secret-2026-at-least-32-chars}
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      ALLOW_INSECURE_LOCAL_DEVELOPMENT: "true"
      NODE_ENV: production
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://iec:${POSTGRES_PASSWORD:-iec-local-development-only}@db:5432/iec_expobot?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
volumes:
  postgres_data:
