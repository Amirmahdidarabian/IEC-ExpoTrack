name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, "feature/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://iec:StrongCiDatabasePassword2026@127.0.0.1:5432/iec_expobot?schema=public
      POSTGRES_PASSWORD: StrongCiDatabasePassword2026
      AUTH_SECRET: ci-only-authentication-secret-2026-not-production
      HTTPS_ENABLED: "true"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run env:check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
